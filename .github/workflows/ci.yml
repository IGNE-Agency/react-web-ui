# Checks the kit on every pull request: tokens, lint and types, the package
# build, the exports map and the consumer fixture, and every story as a render,
# a11y and interaction test, then the Storybook build. Publishing is release.yml.

name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build the default theme
        run: bun run tokens

      - name: Lint, format and type-check
        run: bun run check

      - name: Build the package
        run: bun run build

      - name: Check the exports map and the packed package
        run: bun run check:exports

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test every story
        run: bun run test

      - name: Build Storybook
        run: bun run storybook:build
