# Publishes @igne-agency/react-web-ui to npm when a version tag (v1.2.3) is
# pushed. Authentication is npm trusted publishing (OIDC): the npm org
# igne-agency lists this workflow of IGNE-Agency/react-web-ui as trusted
# publisher, so no npm token is stored in the repository. The tag must match
# package.json. The repository is public, so the package carries provenance.
# `npm publish` runs `prepack`, which builds the package with bun.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm's trusted publisher for this package names this environment.
    environment: Production
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build the default theme
        run: bun run tokens

      - name: Lint, format and type-check
        run: bun run check

      - name: Build the package
        run: bun run build

      - name: Check the exports map and the packed package
        run: bun run check:exports

      - name: Publish
        run: npm publish --access public --provenance
